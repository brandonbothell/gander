apply plugin: 'com.android.application'
apply plugin: 'eclipse'

android {
    namespace "tld.example.gander"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "tld.example.gander"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                if (props['storeFile']) {
                    storeFile file(props['storeFile'])
                    storePassword props['storePassword']
                    keyAlias props['keyAlias']
                    keyPassword props['keyPassword']
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation(platform("com.google.firebase:firebase-bom:35.2.0"))
    implementation("com.google.firebase:firebase-messaging")
    implementation("com.google.firebase:firebase-appcheck-playintegrity")
    debugImplementation("com.google.firebase:firebase-appcheck-debug")

    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation ('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }
    implementation "androidx.security:security-crypto:1.1.0"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('cleanIdeLibs', Delete) {
    delete layout.buildDirectory.dir('ide-libs')
}

tasks.register('copyIdeLibs', Copy) {
    dependsOn 'cleanIdeLibs'
    def libsView = configurations.debugCompileClasspath.incoming.artifactView {
        attributes {
            attribute(Attribute.of('artifactType', String), 'android-classes-jar')
        }
    }
    def index = 0
    from libsView.files
    into layout.buildDirectory.dir('ide-libs')
    eachFile { details ->
        details.name = "${index++}-${details.name}"
    }
}

tasks.register('prepareVscode') {
    group = 'ide'
    description = 'Generates BuildConfig, R.jar, and extracts Android dependencies for VS Code IntelliSense.'
    dependsOn 'copyIdeLibs', 'compileDebugJavaWithJavac'
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name == 'prepareVscode' }) {
        tasks.matching { it.name == 'processDebugGoogleServices' }.configureEach {
            enabled = false
        }
    }
}

tasks.register('copyReleaseApk', Copy) {
    from layout.buildDirectory.dir('outputs/apk/release')
    include '*.apk'
    into layout.projectDirectory.dir('release')
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'copyReleaseApk'
}

eclipse {
    classpath {
        file {
            whenMerged { cp ->
                def SourceFolder = Class.forName('org.gradle.plugins.ide.eclipse.model.SourceFolder')
                def Library = Class.forName('org.gradle.plugins.ide.eclipse.model.Library')

                cp.entries.add(SourceFolder.newInstance('src/main/java', null))
                cp.entries.add(SourceFolder.newInstance('build/generated/source/buildConfig/debug', null))

                def sdkDir = androidComponents.sdkComponents.sdkDirectory.get().asFile
                def androidJar = file("${sdkDir}/platforms/${android.compileSdkVersion}/android.jar")
                if (androidJar.exists()) {
                    cp.entries.add(Library.newInstance(fileReference(androidJar)))
                }

                fileTree('build/ide-libs').matching { include '**/*.jar' }.each { jar ->
                    cp.entries.add(Library.newInstance(fileReference(jar)))
                }

                fileTree('build/intermediates/compile_r_class_jar/debug').matching { include '**/R.jar' }.each { jar ->
                    cp.entries.add(Library.newInstance(fileReference(jar)))
                }
            }
        }
    }
}
